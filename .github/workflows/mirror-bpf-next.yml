name: Mirror configured branches

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two syncs race each other on the same branches.
concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4

      - name: Sync configured mirrors
        env:
          SELF_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: .github/scripts/sync-mirrors.sh "$SELF_URL" .github/mirrors.conf
