name: Mirror configured branches

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4

      - name: Sync configured mirrors
        run: |
          set -euo pipefail
          self="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          while read -r url branch; do
            [[ -z "$url" || "$url" == \#* ]] && continue
            echo "::group::Syncing $url -> $branch"
            rm -rf work
            git init -q work
            cd work
            # Cheap: pull just our own current tip commit (metadata only, no
            # blobs/trees) so the upstream fetch below can recognize what we
            # already have and only transfer commits added since last sync,
            # instead of re-downloading the whole upstream history every run.
            git fetch -q --depth=1 --filter=tree:0 "$self" "refs/heads/$branch" 2>/dev/null || true
            git fetch -q "$url" HEAD
            ok=0
            for attempt in 1 2 3; do
              if git -c http.postBuffer=1048576000 -c http.version=HTTP/1.1 \
                   push --force "$self" "FETCH_HEAD:refs/heads/$branch"; then
                ok=1
                break
              fi
              echo "push attempt $attempt failed, retrying..."
              sleep 10
            done
            [[ $ok -eq 1 ]] || { echo "push to $branch failed after 3 attempts"; exit 1; }
            cd ..
            echo "::endgroup::"
          done < .github/mirrors.conf
