name: Mirror configured branches

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4

      - name: Sync configured mirrors
        run: |
          set -euo pipefail
          while read -r url branch; do
            [[ -z "$url" || "$url" == \#* ]] && continue
            echo "::group::Syncing $url -> $branch"
            rm -rf mirror.git
            git clone --bare "$url" mirror.git
            git -C mirror.git push --force \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              "HEAD:refs/heads/$branch"
            echo "::endgroup::"
          done < .github/mirrors.conf
