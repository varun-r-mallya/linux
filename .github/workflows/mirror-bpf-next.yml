name: Mirror configured branches

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4

      - name: Sync configured mirrors
        run: |
          set -euo pipefail
          self="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          conf="$PWD/.github/mirrors.conf"
          rm -rf work
          git init -q work
          cd work

          # Seed with every branch we already mirror, metadata-only (no
          # blobs/trees). Linux trees (bpf, bpf-next, net, net-next, ...)
          # share the vast majority of their commit history, so a brand-new
          # branch's upstream fetch below can skip re-downloading whatever
          # objects any other already-mirrored branch already brought in,
          # instead of only being able to reuse its own prior sync.
          git fetch -q --filter=tree:0 "$self" '+refs/heads/*:refs/remotes/self/*' 2>/dev/null || true

          while read -r url branch; do
            [[ -z "$url" || "$url" == \#* ]] && continue
            echo "::group::Syncing $url -> $branch"
            git fetch -q "$url" HEAD
            ok=0
            for attempt in 1 2 3; do
              if git -c http.postBuffer=1048576000 -c http.version=HTTP/1.1 \
                   push --force "$self" "FETCH_HEAD:refs/heads/$branch"; then
                ok=1
                break
              fi
              echo "push attempt $attempt failed, retrying..."
              sleep 10
            done
            [[ $ok -eq 1 ]] || { echo "push to $branch failed after 3 attempts"; exit 1; }
            echo "::endgroup::"
          done < "$conf"
          cd ..
